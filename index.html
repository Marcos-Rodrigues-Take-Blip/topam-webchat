<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlipChat</title>
    <style>
        /* Remove margens e barras de rolagem da página inteira */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #ffffff; 
        }

        /* Container que vai segurar o chat e ocupar a tela cheia */
        #meu-chat-tela-cheia {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        /* Garante que o iframe que o Blip vai colocar aí dentro use 100% do espaço */
        #meu-chat-tela-cheia iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }
    </style>
</head>
<body>

    <div id="meu-chat-tela-cheia"></div>

    <script src="https://unpkg.com/blip-chat-widget" type="text/javascript"></script>
    
    <script>
        (function () {
            window.onload = function () {
                
                // 1. Captura os parâmetros passados na URL (lembre-se do '?')
                const urlParams = new URLSearchParams(window.location.search);
                const userPhone = urlParams.get('phone'); 
                const userName = urlParams.get('name');   

                // 2. Instancia o Blip Chat apontando para a nossa DIV e adicionando o Evento
                var blipClient = new BlipChat()
                    .withAppKey('Z3J1cG9hZ3Vhc2JyYXNpbDpjNTIyMTNmZS0xMTlmLTRjZmUtYWIzYS03NDkyYzI2M2QzYzY=')
                    .withCustomCommonUrl('https://valuedesignsmb.chat.blip.ai/')
                    .withTarget('meu-chat-tela-cheia')
                    // --- NOVA PARTE: EVENT HANDLER DE LOAD ---
                    .withEventHandler(BlipChat.LOAD_EVENT, function () {
                        blipClient.sendMessage({
                            "type": "text/plain",
                            "content": "Start" // Você pode alterar essa palavra se seu bot exigir outra
                        });
                    });
                    // -----------------------------------------

                // 3. Aplica a lógica de Autenticação (DEV_AUTH) e Account se os dados existirem na URL
                if (userPhone) {
                    
                    blipClient.withAuth({
                        authType: BlipChat.DEV_AUTH,
                        userIdentity: userPhone,
                        userPassword: userPhone // A senha usada é o próprio telefone neste caso
                    });

                    blipClient.withAccount({
                        fullName: userName || 'Usuário Anonimo',
                        phoneNumber: userPhone,
                        extras: {
                            origem: "github_pages",
                            telefone_capturado: userPhone
                        }
                    });
                }

                // 4. Constrói o chat na tela
                blipClient.build();
            }
        })();
    </script>
</body>
</html>
